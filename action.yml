name: Templating
description: Synchronize a collection of templates
inputs:
  token:
    description: Token with permissions to create and update pull requests
    required: true
  name:
    description: Stylized name of the package (e.g., "Core" or "DDSIM")
    required: true
  organization:
    description: Name of the repository's organization
    required: true
  project-type:
    description: Type of the project
    required: true
    options:
      - c++-python
      - c++-mlir-python
      - pure-python
      - other
  repository:
    description: Name of the repository
    required: true
  base-branch:
    description: Base branch of the pull request
    default: main
  has-changelog-and-upgrade-guide:
    description: Whether the repository has a changelog and upgrade guide
    default: true
  synchronize-agents-md:
    description: Whether to synchronize the AGENTS.md file
    default: true
  synchronize-contribution-guide:
    description: Whether to synchronize the contribution guide
    default: true
  synchronize-documentation-utilities:
    description: Whether to synchronize documentation utilities such as page.html and custom.css
    default: true
  synchronize-installation-guide:
    description: Whether to synchronize the installation guide
    default: true
  synchronize-issue-templates:
    description: Whether to synchronize the issue templates
    default: true
  synchronize-pull-request-template:
    description: Whether to synchronize the pull-request template
    default: true
  synchronize-release-drafter-template:
    description: Whether to synchronize the Release Drafter template
    default: true
  synchronize-renovate-config:
    description: Whether to synchronize the Renovate configuration
    default: true
  synchronize-security-policy:
    description: Whether to synchronize the security policy
    default: true
  synchronize-support-resources:
    description: Whether to synchronize the support resources
    default: true
  release-drafter-categories:
    description: Release Drafter categories as a JSON string. If empty, a reasonable default will be used
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.base-branch }}
        token: ${{ inputs.token }}
        persist-credentials: false
    - name: Install latest version of uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        save-cache: ${{ github.ref == 'refs/heads/main' }}
    - name: Run the templating script
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        TARGET_DIR: ${{ github.workspace }}
        NAME: ${{ inputs.name }}
        ORGANIZATION: ${{ inputs.organization }}
        PROJECT_TYPE: ${{ inputs.project-type }}
        REPOSITORY: ${{ inputs.repository }}
        HAS_CHANGELOG_AND_UPGRADE_GUIDE: ${{ inputs.has-changelog-and-upgrade-guide }}
        SYNCHRONIZE_AGENTS_MD: ${{ inputs.synchronize-agents-md }}
        SYNCHRONIZE_CONTRIBUTION_GUIDE: ${{ inputs.synchronize-contribution-guide }}
        SYNCHRONIZE_DOCUMENTATION_UTILITIES: ${{ inputs.synchronize-documentation-utilities }}
        SYNCHRONIZE_INSTALLATION_GUIDE: ${{ inputs.synchronize-installation-guide }}
        SYNCHRONIZE_ISSUE_TEMPLATES: ${{ inputs.synchronize-issue-templates }}
        SYNCHRONIZE_PULL_REQUEST_TEMPLATE: ${{ inputs.synchronize-pull-request-template }}
        SYNCHRONIZE_RELEASE_DRAFTER_TEMPLATE: ${{ inputs.synchronize-release-drafter-template }}
        SYNCHRONIZE_RENOVATE_CONFIG: ${{ inputs.synchronize-renovate-config }}
        SYNCHRONIZE_SECURITY_POLICY: ${{ inputs.synchronize-security-policy }}
        SYNCHRONIZE_SUPPORT_RESOURCES: ${{ inputs.synchronize-support-resources }}
        RELEASE_DRAFTER_CATEGORIES: ${{ inputs.release-drafter-categories }}
      run: |
        uv run mqt-templates \
          --target_dir "$TARGET_DIR" \
          --name "$NAME" \
          --organization $ORGANIZATION \
          --project_type $PROJECT_TYPE \
          --repository $REPOSITORY \
          --has_changelog_and_upgrade_guide $HAS_CHANGELOG_AND_UPGRADE_GUIDE \
          --synchronize_agents_md $SYNCHRONIZE_AGENTS_MD \
          --synchronize_contribution_guide $SYNCHRONIZE_CONTRIBUTION_GUIDE \
          --synchronize_documentation_utilities $SYNCHRONIZE_DOCUMENTATION_UTILITIES \
          --synchronize_installation_guide $SYNCHRONIZE_INSTALLATION_GUIDE \
          --synchronize_issue_templates $SYNCHRONIZE_ISSUE_TEMPLATES \
          --synchronize_pull_request_template $SYNCHRONIZE_PULL_REQUEST_TEMPLATE \
          --synchronize_release_drafter_template $SYNCHRONIZE_RELEASE_DRAFTER_TEMPLATE \
          --synchronize_renovate_config $SYNCHRONIZE_RENOVATE_CONFIG \
          --synchronize_security_policy $SYNCHRONIZE_SECURITY_POLICY \
          --synchronize_support_resources $SYNCHRONIZE_SUPPORT_RESOURCES \
          --release_drafter_categories "$RELEASE_DRAFTER_CATEGORIES"
    - if: ${{ github.ref != format('refs/heads/{0}', inputs.base-branch) }}
      name: Show changes
      shell: bash
      run: git --no-pager diff
    - if: ${{ github.ref == format('refs/heads/{0}', inputs.base-branch) }}
      name: Determine branch name
      id: determine-branch-name
      shell: bash
      env:
        MQT_TEMPLATES_REF: ${{ github.action_ref }}
      run: |
        echo "MQT_TEMPLATES_REF: $MQT_TEMPLATES_REF"
        SANITIZED_REF="$(printf '%s' "$MQT_TEMPLATES_REF" | tr -d '\n')"
        echo "SANITIZED_REF: $SANITIZED_REF"
        echo "branch-name=update-mqt-templates-$SANITIZED_REF" >> "$GITHUB_OUTPUT"
    - if: ${{ github.ref == format('refs/heads/{0}', inputs.base-branch) }}
      name: Create pull request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ github.repository }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        BRANCH_NAME: ${{ steps.determine-branch-name.outputs.branch-name }}
      run: |
        set -euo pipefail

        # Nothing to do if the templating step did not change anything.
        git add --all
        if git diff --cached --quiet; then
          echo "No changes to the templated files."
          exit 0
        fi

        # Point the pull request branch at the current base, so the commit below applies
        # cleanly whether or not the branch already exists from an earlier run.
        BASE_OID="$(git rev-parse HEAD)"
        gh api "repos/$REPOSITORY/git/refs" \
          --field "ref=refs/heads/$BRANCH_NAME" \
          --field "sha=$BASE_OID" >/dev/null 2>&1 ||
          gh api --method PATCH "repos/$REPOSITORY/git/refs/heads/$BRANCH_NAME" \
            --field "sha=$BASE_OID" --field "force=true" >/dev/null

        # Commit through the GraphQL API so that GitHub signs the commit.
        # `--no-renames` splits a rename into a deletion and an addition, so that the old
        # path is removed rather than left behind.
        ADDITIONS="$(git diff --cached --no-renames --name-only --diff-filter=ACM |
          while IFS= read -r file; do
            jq -n --arg path "$file" \
                  --arg contents "$(base64 < "$file" | tr -d '\n')" \
                  '{path: $path, contents: $contents}'
          done | jq --slurp '.')"
        DELETIONS="$(git diff --cached --no-renames --name-only --diff-filter=D |
          jq --raw-input '{path: .}' | jq --slurp '.')"

        jq -n \
          --arg repository "$REPOSITORY" \
          --arg branch "$BRANCH_NAME" \
          --arg oid "$BASE_OID" \
          --arg headline "📝 Update templated files" \
          --argjson additions "$ADDITIONS" \
          --argjson deletions "$DELETIONS" \
          '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: {
              input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $oid,
                fileChanges: {additions: $additions, deletions: $deletions}
              }
            }
          }' | gh api graphql --input - >/dev/null

        # Open a pull request unless one is already open for this branch.
        if [ -z "$(gh pr list --repo "$REPOSITORY" --head "$BRANCH_NAME" --state open --json number --jq '.[].number')" ]; then
          gh pr create \
            --repo "$REPOSITORY" \
            --title "📝 Update templated files" \
            --body "This pull request updates the files in this repository with the latest changes from the MQT Templates repository.
        For details on the respective changes, see the [changelog](https://github.com/munich-quantum-toolkit/templates/blob/main/CHANGELOG.md) as well as the [upgrade guide](https://github.com/munich-quantum-toolkit/templates/blob/main/UPGRADING.md)." \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --label documentation
        fi
